# 테스트 CI — push/PR마다 전체 테스트 + 린트를 돌린다.
# (release.yml은 태그 푸시 시 배포만 담당 — 이 워크플로가 일상 회귀 방어선)
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 배포 대상 3 OS에서 테스트 (AOT 트랜스파일 테스트는 cc 없으면 자동 스킵)
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --verbose
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      # 자급 코어 빌드(https 끔)가 계속 컴파일·통과하는지 확인 (헌법 5조의 예외 범위 고정)
      - name: cargo test (no default features)
        run: cargo test --no-default-features
      - name: cargo clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  # 문서가 실제 동작과 같은지 (Phase 63): 위키의 bang 예제를 실행해 적힌 출력과 비교하고 내부 링크를 검사한다.
  # (llms.txt·위키 빌트인 목록·VS Code 문법 대조는 cargo test의 tests/docs_test.rs가 맡는다.)
  docs:
    name: docs (wiki examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build bang
        run: cargo build
      - name: verify wiki
        run: python3 wiki/tools/verify_wiki.py target/debug/bang
      - name: bang fmt --check (examples·tests·bench)
        run: ./target/debug/bang fmt --check examples tests bench
